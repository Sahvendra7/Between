[project]
name = "between"
version = "0.1.0"
description = "Co-parent expense coordination: an AI reads the agreement once, both parents approve, code decides, PayPal sandbox checkout pays."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sahvendra" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.3",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "tests/fixtures"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
